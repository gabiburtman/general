<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#c77dba">
<link rel="manifest" href="manifest.json">
<title>3rd Tri Exercises</title>
<style>
:root {
  --bg: #faf5f0;
  --card: #ffffff;
  --primary: #c77dba;
  --primary-light: #f0dded;
  --primary-dark: #a35e97;
  --text: #3d3040;
  --text-light: #8a7a8e;
  --success: #7dba89;
  --success-light: #e3f3e6;
  --border: #e8dfe5;
  --shadow: 0 2px 8px rgba(61,48,64,0.08);
  --radius: 14px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  padding-bottom: 80px;
  -webkit-tap-highlight-color: transparent;
}

/* ---- NAV ---- */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
  z-index: 100;
}
.bottom-nav button {
  background: none;
  border: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: 11px;
  color: var(--text-light);
  cursor: pointer;
  padding: 4px 12px;
  border-radius: 8px;
  transition: all 0.2s;
}
.bottom-nav button.active { color: var(--primary-dark); font-weight: 600; }
.bottom-nav button .nav-icon { font-size: 22px; line-height: 1; }

/* ---- HEADER ---- */
.header {
  padding: 16px 20px 12px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 50;
}
.header h1 { font-size: 20px; font-weight: 700; }
.header .subtitle { font-size: 13px; color: var(--text-light); margin-top: 2px; }

/* ---- PAGES ---- */
.page { display: none; padding: 16px 16px 24px; }
.page.active { display: block; }

/* ---- TODAY PAGE ---- */
.today-summary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 20px;
}
.today-summary .big-num { font-size: 40px; font-weight: 800; line-height: 1; }
.today-summary .label { font-size: 13px; opacity: 0.85; margin-top: 4px; }
.today-summary .progress-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 14px;
}
.today-summary .progress-bar {
  flex: 1;
  height: 8px;
  background: rgba(255,255,255,0.3);
  border-radius: 4px;
  overflow: hidden;
}
.today-summary .progress-bar .fill {
  height: 100%;
  background: white;
  border-radius: 4px;
  transition: width 0.4s ease;
}
.today-summary .progress-text { font-size: 13px; font-weight: 600; white-space: nowrap; }

.section-title {
  font-size: 15px;
  font-weight: 700;
  margin: 20px 0 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ---- EXERCISE CARD ---- */
.exercise-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  border: 2px solid transparent;
  transition: all 0.2s;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}
.exercise-card.done {
  border-color: var(--success);
  background: var(--success-light);
}
.exercise-card .card-top {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.exercise-card .check-circle {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 14px;
  transition: all 0.2s;
  margin-top: 2px;
}
.exercise-card.done .check-circle {
  background: var(--success);
  border-color: var(--success);
  color: white;
}
.exercise-card .card-info { flex: 1; min-width: 0; }
.exercise-card .card-name { font-size: 15px; font-weight: 600; }
.exercise-card.done .card-name { text-decoration: line-through; opacity: 0.6; }
.exercise-card .card-meta {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 4px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.exercise-card .tag {
  background: var(--primary-light);
  color: var(--primary-dark);
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 500;
}
.exercise-card .card-detail {
  font-size: 13px;
  color: var(--text-light);
  margin-top: 8px;
  line-height: 1.4;
  display: none;
}
.exercise-card.expanded .card-detail { display: block; }
.exercise-card .card-actions {
  display: none;
  gap: 8px;
  margin-top: 12px;
}
.exercise-card.expanded .card-actions { display: flex; }
.card-actions button {
  padding: 8px 16px;
  border: none;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.btn-swap {
  background: var(--primary-light);
  color: var(--primary-dark);
}
.btn-video {
  background: var(--text);
  color: white;
}

/* ---- WEEK PAGE ---- */
.week-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  margin-bottom: 20px;
}
.day-col {
  text-align: center;
  cursor: pointer;
  border-radius: 12px;
  padding: 8px 2px;
  transition: background 0.2s;
}
.day-col.selected { background: var(--primary-light); }
.day-col .day-label { font-size: 11px; color: var(--text-light); font-weight: 600; }
.day-col .day-num { font-size: 18px; font-weight: 700; margin: 4px 0; }
.day-col .day-dots { font-size: 9px; color: var(--success); letter-spacing: -1px; }
.day-col.today .day-num {
  background: var(--primary);
  color: white;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.day-col.future { opacity: 0.4; }

.week-day-detail { margin-top: 8px; }

/* ---- EXERCISES (library) PAGE ---- */
.search-box {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  font-size: 15px;
  background: var(--card);
  outline: none;
  margin-bottom: 16px;
}
.search-box:focus { border-color: var(--primary); }

.filter-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 12px;
  -webkit-overflow-scrolling: touch;
}
.filter-chip {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 13px;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.2s;
}
.filter-chip.active {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}

/* ---- STATS PAGE ---- */
.stat-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  text-align: center;
}
.stat-card .stat-num { font-size: 36px; font-weight: 800; color: var(--primary); }
.stat-card .stat-label { font-size: 13px; color: var(--text-light); margin-top: 4px; }

.streak-calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-top: 12px;
}
.streak-day {
  aspect-ratio: 1;
  border-radius: 6px;
  background: var(--border);
}
.streak-day.has-activity { background: var(--primary-light); }
.streak-day.full { background: var(--success); }

/* ---- SWAP MODAL ---- */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--card);
  border-radius: 20px 20px 0 0;
  padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
  width: 100%;
  max-width: 500px;
  max-height: 70vh;
  overflow-y: auto;
}
.modal h3 { font-size: 17px; margin-bottom: 16px; }
.modal .close-btn {
  position: absolute;
  right: 20px;
  top: 20px;
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
}

/* ---- EMPTY STATE ---- */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-light);
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty-state p { font-size: 15px; line-height: 1.5; }

/* ---- PLAN CONTROLS ---- */
.plan-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  padding: 12px 16px;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.plan-bar .plan-info {
  flex: 1;
  font-size: 13px;
  color: var(--text-light);
}
.plan-bar .plan-info strong {
  color: var(--text);
  font-size: 14px;
}
.btn-plan {
  padding: 8px 16px;
  border: none;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  background: var(--primary);
  color: white;
  white-space: nowrap;
}
.btn-plan:active { opacity: 0.8; }
.day-col .day-time {
  font-size: 10px;
  color: var(--text-light);
  margin-top: 2px;
}
.time-badge {
  display: inline-block;
  background: var(--primary-light);
  color: var(--primary-dark);
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 500;
  margin-left: 4px;
}
.coverage-note {
  font-size: 12px;
  color: var(--text-light);
  padding: 8px 0;
  line-height: 1.5;
}

/* ---- UTILITIES ---- */
.fade-in { animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>

<div class="header">
  <h1 id="header-title">Today</h1>
  <div class="subtitle" id="header-subtitle"></div>
</div>

<!-- ===== TODAY ===== -->
<div class="page active" id="page-today">
  <div class="today-summary" id="today-summary">
    <div class="big-num" id="today-done-count">0</div>
    <div class="label" id="today-done-label">exercises done today</div>
    <div class="progress-row">
      <div class="progress-bar"><div class="fill" id="today-progress-fill" style="width:0%"></div></div>
      <div class="progress-text" id="today-progress-text">0 / 0</div>
    </div>
  </div>
  <div id="today-list"></div>
</div>

<!-- ===== WEEK ===== -->
<div class="page" id="page-week">
  <div class="plan-bar" id="plan-bar"></div>
  <div class="week-grid" id="week-grid"></div>
  <div class="week-day-detail" id="week-day-detail"></div>
</div>

<!-- ===== LIBRARY ===== -->
<div class="page" id="page-library">
  <input type="text" class="search-box" id="search-box" placeholder="Search exercises...">
  <div class="filter-row" id="filter-row"></div>
  <div id="library-list"></div>
  <button id="download-json-btn" style="
    display:block;
    width:100%;
    margin-top:20px;
    padding:14px;
    background:var(--primary);
    color:white;
    border:none;
    border-radius:var(--radius);
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  ">Save Exercises JSON to Device</button>
</div>

<!-- ===== STATS ===== -->
<div class="page" id="page-stats">
  <div id="stats-content"></div>
</div>

<!-- ===== SWAP MODAL ===== -->
<div class="modal-overlay" id="swap-modal">
  <div class="modal">
    <h3 id="swap-title">Swap exercise</h3>
    <div id="swap-list"></div>
  </div>
</div>

<!-- ===== BOTTOM NAV ===== -->
<div class="bottom-nav">
  <button class="active" data-page="today">
    <span class="nav-icon">&#9673;</span>
    Today
  </button>
  <button data-page="week">
    <span class="nav-icon">&#9635;</span>
    Week
  </button>
  <button data-page="library">
    <span class="nav-icon">&#9776;</span>
    Library
  </button>
  <button data-page="stats">
    <span class="nav-icon">&#9733;</span>
    Stats
  </button>
</div>

<script>
// ============================================================
// DATA LAYER - stores raw JSON from user, reads from exercises.json
// ============================================================
const DB_KEY = '3rdtri_exercises';
const TRACK_KEY = '3rdtri_tracking';
const SWAP_KEY = '3rdtri_swaps';

function loadExercises() {
  const raw = localStorage.getItem(DB_KEY);
  return raw ? JSON.parse(raw) : [];
}
function saveExercises(list) {
  localStorage.setItem(DB_KEY, JSON.stringify(list));
}
function loadTracking() {
  const raw = localStorage.getItem(TRACK_KEY);
  return raw ? JSON.parse(raw) : {};
}
function saveTracking(data) {
  localStorage.setItem(TRACK_KEY, JSON.stringify(data));
}
function loadSwaps() {
  const raw = localStorage.getItem(SWAP_KEY);
  return raw ? JSON.parse(raw) : {};
}
function saveSwaps(data) {
  localStorage.setItem(SWAP_KEY, JSON.stringify(data));
}

// On first load (or when exercises.json updates), seed localStorage
async function seedFromJSON() {
  try {
    const resp = await fetch('data/exercises.json');
    const data = await resp.json();
    if (data.length > 0) {
      const existing = loadExercises();
      // Merge: add new exercises, update existing by id
      const map = {};
      existing.forEach(e => map[e.id] = e);
      data.forEach(e => map[e.id] = e);
      saveExercises(Object.values(map));
    }
  } catch(e) {}
}

// ============================================================
// WEEKLY PLAN - Smart 15-minute daily plans
// ============================================================
const PLAN_KEY = '3rdtri_weekplan';
const DAILY_BUDGET_SECONDS = 900; // 15 minutes
const TRANSITION_SECONDS = 10;

function loadWeekPlan(mondayDate) {
  const raw = localStorage.getItem(PLAN_KEY);
  if (!raw) return null;
  const plans = JSON.parse(raw);
  return plans[mondayDate] || null;
}

function saveWeekPlan(mondayDate, plan) {
  const raw = localStorage.getItem(PLAN_KEY);
  const plans = raw ? JSON.parse(raw) : {};
  plans[mondayDate] = plan;
  localStorage.setItem(PLAN_KEY, JSON.stringify(plans));
}

// ============================================================
// ACCESSORS - adapt user's rich schema to UI needs
// ============================================================
function exFreq(ex) {
  return (ex.schedule && ex.schedule.frequency) || 'daily';
}
function exType(ex) {
  return (ex.execution && ex.execution.type) || 'reps';
}
function exAmount(ex) {
  if (!ex.execution) return 10;
  return ex.execution.default_amount || ex.execution.duration || ex.execution.reps || 10;
}
function exSets(ex) {
  return (ex.execution && ex.execution.sets) || 1;
}
function exCategory(ex) {
  return ex.category || 'general';
}
function exGroup(ex) {
  return ex.replacement_group || '';
}
function exInstructions(ex) {
  if (Array.isArray(ex.instructions)) return ex.instructions.join('\n');
  return ex.instructions || '';
}
function exNote(ex) {
  return (ex.execution && ex.execution.note) || '';
}
function exVariations(ex) {
  return ex.variations || [];
}
function exSimilar(ex) {
  return (ex.enrichment && ex.enrichment.similar_exercises) || [];
}
function exBenefits(ex) {
  return (ex.enrichment && ex.enrichment.benefits) || '';
}
function exSafety(ex) {
  if (!ex.safety_profile) return '';
  return ex.safety_profile.trimester_3_notes || '';
}
function exDoseText(ex) {
  const t = exType(ex);
  const amt = exAmount(ex);
  const sets = exSets(ex);
  let base = '';
  if (t === 'timer' || t === 'timed' || t === 'timed_hold') base = amt + 's';
  else base = amt + ' reps';
  if (sets > 1) base += ' x ' + sets + ' sets';
  return base;
}
function exPriority(ex) {
  return (ex.schedule && ex.schedule.priority) || 'normal';
}

// ============================================================
// DATE HELPERS
// ============================================================
function dateStr(d) {
  return d.toISOString().slice(0, 10);
}
function today() { return dateStr(new Date()); }
function getMonday(d) {
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  dt.setDate(dt.getDate() + diff);
  return dateStr(dt);
}
function addDays(d, n) {
  const dt = new Date(d);
  dt.setDate(dt.getDate() + n);
  return dateStr(dt);
}
function formatDateShort(d) {
  return new Date(d + 'T12:00:00').toLocaleDateString('en', { weekday: 'short', month: 'short', day: 'numeric' });
}
const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

// ============================================================
// SCHEDULER
// ============================================================
function freqToDaysPerWeek(freq) {
  if (!freq) return 7;
  if (freq === 'daily') return 7;
  const m = freq.match(/(\d+)x/);
  return m ? parseInt(m[1]) : 7;
}

function assignDays(daysPerWeek) {
  if (daysPerWeek >= 7) return [0,1,2,3,4,5,6];
  if (daysPerWeek === 6) return [0,1,2,3,4,5];
  if (daysPerWeek === 5) return [0,1,2,3,4];
  if (daysPerWeek === 4) return [0,1,3,4];
  if (daysPerWeek === 3) return [0,2,4];
  if (daysPerWeek === 2) return [1,4];
  if (daysPerWeek === 1) return [2];
  return [0,1,2,3,4,5,6];
}

function getScheduleForDate(dateString) {
  const exercises = loadExercises();
  const monday = getMonday(dateString);
  const dayIndex = Math.round((new Date(dateString) - new Date(monday)) / 86400000);

  const swaps = loadSwaps();
  const dateSwaps = swaps[dateString] || {};

  // Check for a generated weekly plan
  const plan = loadWeekPlan(monday);
  if (plan) {
    const dayIds = [...plan.specialistIds, ...(plan.days[dayIndex] || [])];
    return dayIds.map(id => {
      if (dateSwaps[id]) {
        const swapped = exercises.find(e => e.id === dateSwaps[id]);
        if (swapped) return { ...swapped, _swappedFrom: id };
      }
      return exercises.find(e => e.id === id);
    }).filter(Boolean);
  }

  // Fallback: old deterministic schedule
  return exercises.filter(ex => {
    const dpw = freqToDaysPerWeek(exFreq(ex));
    const days = assignDays(dpw);
    return days.includes(dayIndex);
  }).map(ex => {
    if (dateSwaps[ex.id]) {
      const swapped = exercises.find(e => e.id === dateSwaps[ex.id]);
      if (swapped) return { ...swapped, _swappedFrom: ex.id };
    }
    return ex;
  });
}

// ============================================================
// DURATION ESTIMATION
// ============================================================
function estimateDuration(ex) {
  const type = exType(ex);
  const amount = exAmount(ex);
  const sets = exSets(ex);
  if (type === 'timer' || type === 'timed' || type === 'timed_hold') {
    return amount * sets;
  }
  // reps: ~3 seconds per rep
  return amount * sets * 3;
}

function estimateDaySeconds(exerciseList) {
  if (!exerciseList || exerciseList.length === 0) return 0;
  return exerciseList.reduce((sum, ex) => sum + estimateDuration(ex) + TRANSITION_SECONDS, 0);
}

function formatTimeMinSec(seconds) {
  const mins = Math.floor(seconds / 60);
  const secs = Math.round(seconds % 60);
  if (mins === 0) return secs + 's';
  if (secs === 0) return mins + ' min';
  return mins + ':' + String(secs).padStart(2, '0');
}

// ============================================================
// WEEKLY PLAN GENERATOR
// ============================================================
function generateWeeklyPlan(mondayDate) {
  const exercises = loadExercises();
  if (exercises.length === 0) return null;

  // Calculate durations (exercise time + transition)
  const exDur = {};
  exercises.forEach(ex => {
    exDur[ex.id] = estimateDuration(ex) + TRANSITION_SECONDS;
  });

  // Classify: daily specialists vs everything else
  const dailySpecialists = exercises.filter(ex => ex.specialist && exFreq(ex) === 'daily');
  const nonSpecialists = exercises.filter(ex => !(ex.specialist && exFreq(ex) === 'daily'));

  const specialistTime = dailySpecialists.reduce((sum, ex) => sum + exDur[ex.id], 0);
  const dailyBudget = DAILY_BUDGET_SECONDS - specialistTime;

  // Determine max and target appearances per week
  const maxApps = {};
  const targetApps = {};
  nonSpecialists.forEach(ex => {
    const freq = freqToDaysPerWeek(exFreq(ex));
    maxApps[ex.id] = freq;
    const priority = exPriority(ex);
    if (priority === 'high') targetApps[ex.id] = Math.min(freq, 5);
    else if (priority === 'medium') targetApps[ex.id] = Math.min(freq, 3);
    else targetApps[ex.id] = 1;
    targetApps[ex.id] = Math.max(1, targetApps[ex.id]);
  });

  // Initialize plan
  const weekPlan = Array.from({length: 7}, () => []);
  const dayTimeUsed = Array(7).fill(0);
  const assigned = {};
  nonSpecialists.forEach(ex => assigned[ex.id] = new Set());

  // Find the best day for an exercise
  function findBestDay(ex, excludeDays) {
    if (assigned[ex.id].size >= maxApps[ex.id]) return -1;
    let bestDay = -1;
    let bestScore = -Infinity;

    for (let day = 0; day < 7; day++) {
      if (assigned[ex.id].has(day)) continue;
      if (excludeDays && excludeDays.has(day)) continue;
      if (dayTimeUsed[day] + exDur[ex.id] > dailyBudget) continue;

      let score = 0;
      // Prefer days with more remaining time
      score += (dailyBudget - dayTimeUsed[day]) / Math.max(dailyBudget, 1) * 10;

      // Penalize days where this group is already represented
      const group = exGroup(ex);
      if (group) {
        const groupCount = weekPlan[day].filter(e => exGroup(e) === group).length;
        score -= groupCount * 15;
      }

      // Prefer spreading across the week
      for (const d of assigned[ex.id]) {
        const gap = Math.abs(day - d);
        if (gap <= 1) score -= 8;
        else if (gap === 2) score -= 3;
      }

      // Small random factor
      score += Math.random() * 2;

      if (score > bestScore) {
        bestScore = score;
        bestDay = day;
      }
    }
    return bestDay;
  }

  function assignToDay(ex, day) {
    weekPlan[day].push(ex);
    dayTimeUsed[day] += exDur[ex.id];
    assigned[ex.id].add(day);
  }

  // Priority ordering
  const priorityOrder = {high: 0, medium: 1, low: 2};

  // Phase 1: Guarantee every exercise appears at least once
  const sorted = [...nonSpecialists].sort((a, b) => {
    const pa = priorityOrder[exPriority(a)] || 1;
    const pb = priorityOrder[exPriority(b)] || 1;
    if (pa !== pb) return pa - pb;
    // Shorter exercises first within same priority (easier to fit)
    return exDur[a.id] - exDur[b.id];
  });

  for (const ex of sorted) {
    if (assigned[ex.id].size === 0) {
      const day = findBestDay(ex);
      if (day !== -1) assignToDay(ex, day);
    }
  }

  // Phase 2: Fill toward target appearances
  for (let pass = 0; pass < 6; pass++) {
    const pool = [...nonSpecialists]
      .filter(ex => assigned[ex.id].size < targetApps[ex.id])
      .sort((a, b) => {
        // Exercises furthest from target first
        const aRatio = assigned[a.id].size / targetApps[a.id];
        const bRatio = assigned[b.id].size / targetApps[b.id];
        if (Math.abs(aRatio - bRatio) > 0.1) return aRatio - bRatio;
        // Then higher priority first
        return (priorityOrder[exPriority(a)] || 1) - (priorityOrder[exPriority(b)] || 1);
      });

    let placed = false;
    for (const ex of pool) {
      if (assigned[ex.id].size >= targetApps[ex.id]) continue;
      const day = findBestDay(ex);
      if (day !== -1) {
        assignToDay(ex, day);
        placed = true;
      }
    }
    if (!placed) break;
  }

  // Phase 3: Fill remaining time on underfilled days with high-priority extras
  for (let day = 0; day < 7; day++) {
    if (dayTimeUsed[day] < dailyBudget * 0.6) {
      const candidates = nonSpecialists
        .filter(ex =>
          !assigned[ex.id].has(day) &&
          assigned[ex.id].size < maxApps[ex.id] &&
          dayTimeUsed[day] + exDur[ex.id] <= dailyBudget
        )
        .sort((a, b) => (priorityOrder[exPriority(a)] || 1) - (priorityOrder[exPriority(b)] || 1));

      for (const ex of candidates) {
        if (dayTimeUsed[day] + exDur[ex.id] > dailyBudget) continue;
        assignToDay(ex, day);
      }
    }
  }

  // Build and save plan
  const plan = {
    mondayDate,
    generated: new Date().toISOString(),
    specialistIds: dailySpecialists.map(ex => ex.id),
    days: weekPlan.map(dayExs => dayExs.map(ex => ex.id))
  };

  saveWeekPlan(mondayDate, plan);
  return plan;
}

// ============================================================
// TRACKING
// ============================================================
function isExerciseDone(dateString, exerciseId) {
  const tracking = loadTracking();
  return !!(tracking[dateString] && tracking[dateString][exerciseId]);
}
function toggleExercise(dateString, exerciseId) {
  const tracking = loadTracking();
  if (!tracking[dateString]) tracking[dateString] = {};
  tracking[dateString][exerciseId] = !tracking[dateString][exerciseId];
  saveTracking(tracking);
  return tracking[dateString][exerciseId];
}
function getDayStats(dateString) {
  const scheduled = getScheduleForDate(dateString);
  const tracking = loadTracking();
  const dayData = tracking[dateString] || {};
  const done = scheduled.filter(ex => dayData[ex.id]).length;
  return { total: scheduled.length, done };
}

// ============================================================
// UI STATE
// ============================================================
let currentPage = 'today';
let selectedWeekDate = today();
let expandedCard = null;

// ============================================================
// NAVIGATION
// ============================================================
document.querySelectorAll('.bottom-nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    currentPage = btn.dataset.page;
    document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + currentPage).classList.add('active');
    updateHeader();
    renderCurrentPage();
  });
});

function updateHeader() {
  const title = document.getElementById('header-title');
  const sub = document.getElementById('header-subtitle');
  if (currentPage === 'today') {
    title.textContent = 'Today';
    sub.textContent = formatDateShort(today());
  } else if (currentPage === 'week') {
    title.textContent = 'This Week';
    sub.textContent = '';
  } else if (currentPage === 'library') {
    title.textContent = 'Exercises';
    const exercises = loadExercises();
    sub.textContent = exercises.length + ' exercises';
  } else if (currentPage === 'stats') {
    title.textContent = 'Stats';
    sub.textContent = '';
  }
}

function renderCurrentPage() {
  if (currentPage === 'today') renderToday();
  else if (currentPage === 'week') renderWeek();
  else if (currentPage === 'library') renderLibrary();
  else if (currentPage === 'stats') renderStats();
}

// ============================================================
// RENDER: TODAY
// ============================================================
function renderToday() {
  const dateString = today();
  const scheduled = getScheduleForDate(dateString);
  const { total, done } = getDayStats(dateString);
  const estTime = estimateDaySeconds(scheduled);

  document.getElementById('today-done-count').textContent = done;
  document.getElementById('today-done-label').textContent = `exercise${done !== 1 ? 's' : ''} done today \u00B7 ~${formatTimeMinSec(estTime)}`;
  document.getElementById('today-progress-fill').style.width = total ? (done / total * 100) + '%' : '0%';
  document.getElementById('today-progress-text').textContent = `${done} / ${total}`;

  const list = document.getElementById('today-list');
  if (scheduled.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">&#127358;</div>
        <p>No exercises yet!<br>Add exercises to get started.</p>
      </div>`;
    return;
  }

  const pending = scheduled.filter(ex => !isExerciseDone(dateString, ex.id));
  const completed = scheduled.filter(ex => isExerciseDone(dateString, ex.id));

  let html = '';
  if (pending.length) {
    html += `<div class="section-title">To do (${pending.length})</div>`;
    pending.forEach(ex => { html += exerciseCardHTML(ex, dateString); });
  }
  if (completed.length) {
    html += `<div class="section-title">Done (${completed.length})</div>`;
    completed.forEach(ex => { html += exerciseCardHTML(ex, dateString); });
  }
  list.innerHTML = html;
  attachCardListeners(list, dateString);
}

function exerciseCardHTML(ex, dateString) {
  const done = isExerciseDone(dateString, ex.id);
  const expanded = expandedCard === ex.id;
  const dose = exDoseText(ex);
  const cat = exCategory(ex);
  const freq = exFreq(ex);
  const instructions = exInstructions(ex);
  const note = exNote(ex);
  const benefits = exBenefits(ex);
  const safety = exSafety(ex);
  const variations = exVariations(ex);
  const similar = exSimilar(ex);
  const hasSwap = variations.length > 0 || similar.length > 0;
  const priority = exPriority(ex);

  let detailHTML = '';
  if (instructions) {
    detailHTML += `<div style="white-space:pre-line;line-height:1.6;">${instructions}</div>`;
  }
  if (note) {
    detailHTML += `<p style="margin-top:8px;font-style:italic;color:var(--primary-dark);">${note}</p>`;
  }
  if (benefits) {
    detailHTML += `<p style="margin-top:8px;font-size:12px;color:var(--text-light);">${benefits}</p>`;
  }
  if (safety) {
    detailHTML += `<p style="margin-top:6px;font-size:12px;color:var(--success);">${safety}</p>`;
  }
  if (variations.length > 0) {
    detailHTML += `<div style="margin-top:10px;font-size:12px;color:var(--text-light);">Variations: ${variations.map(v => v.name).join(', ')}</div>`;
  }

  return `
    <div class="exercise-card fade-in ${done ? 'done' : ''} ${expanded ? 'expanded' : ''}" data-id="${ex.id}">
      <div class="card-top">
        <div class="check-circle">${done ? '&#10003;' : ''}</div>
        <div class="card-info">
          <div class="card-name">${ex.name}</div>
          <div class="card-meta">
            <span>${dose}</span>
            <span class="tag">${cat}</span>
            ${priority === 'high' ? '<span class="tag" style="background:#ffe0e0;color:#c44;">high</span>' : ''}
          </div>
        </div>
      </div>
      <div class="card-detail">
        ${detailHTML || '<p>No instructions yet.</p>'}
      </div>
      <div class="card-actions">
        ${hasSwap ? `<button class="btn-swap" data-swap="${ex.id}">Swap</button>` : ''}
      </div>
    </div>`;
}

function attachCardListeners(container, dateString) {
  container.querySelectorAll('.exercise-card').forEach(card => {
    const id = card.dataset.id;

    card.querySelector('.check-circle').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleExercise(dateString, id);
      renderCurrentPage();
    });

    card.addEventListener('click', (e) => {
      if (e.target.closest('.check-circle') || e.target.closest('button')) return;
      expandedCard = expandedCard === id ? null : id;
      renderCurrentPage();
    });

    const swapBtn = card.querySelector('.btn-swap');
    if (swapBtn) {
      swapBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openSwapModal(swapBtn.dataset.swap, dateString);
      });
    }
  });
}

// ============================================================
// SWAP MODAL - uses variations + similar exercises + same replacement_group
// ============================================================
function openSwapModal(exerciseId, dateString) {
  const exercises = loadExercises();
  const ex = exercises.find(e => e.id === exerciseId);
  if (!ex) return;

  const modal = document.getElementById('swap-modal');
  document.getElementById('swap-title').textContent = `Swap "${ex.name}" with:`;

  // Collect swap candidates: variations (inline), similar by id, same replacement group
  let candidates = [];

  // Variations are inline (not separate exercises), show them as options
  const variations = exVariations(ex);
  variations.forEach(v => {
    candidates.push({ id: ex.id + '__var__' + v.name.replace(/\s/g,'_'), name: v.name, note: v.instruction_note, isVariation: true });
  });

  // Similar exercises by id
  const similar = exSimilar(ex);
  similar.forEach(sid => {
    const s = exercises.find(e => e.id === sid);
    if (s) candidates.push({ id: s.id, name: s.name, note: exDoseText(s), isVariation: false });
  });

  // Same replacement group
  if (exGroup(ex)) {
    exercises.filter(e => e.id !== ex.id && exGroup(e) === exGroup(ex)).forEach(e => {
      if (!candidates.find(c => c.id === e.id)) {
        candidates.push({ id: e.id, name: e.name, note: exDoseText(e), isVariation: false });
      }
    });
  }

  if (candidates.length === 0) {
    modal.classList.remove('active');
    return;
  }

  let html = '';
  candidates.forEach(c => {
    html += `
      <div class="exercise-card" style="cursor:pointer" data-swap-to="${c.id}">
        <div class="card-top">
          <div class="card-info">
            <div class="card-name">${c.name}</div>
            <div class="card-meta">
              <span>${c.note || ''}</span>
              ${c.isVariation ? '<span class="tag">variation</span>' : '<span class="tag">alternative</span>'}
            </div>
          </div>
        </div>
      </div>`;
  });
  document.getElementById('swap-list').innerHTML = html;

  modal.classList.add('active');

  // Close on backdrop
  const closeHandler = (e) => {
    if (e.target === modal) {
      modal.classList.remove('active');
      modal.removeEventListener('click', closeHandler);
    }
  };
  modal.addEventListener('click', closeHandler);

  modal.querySelectorAll('[data-swap-to]').forEach(card => {
    card.addEventListener('click', () => {
      // For now swap just marks the original as done and re-renders
      // Full swap would need tracking the variation chosen
      const swaps = loadSwaps();
      if (!swaps[dateString]) swaps[dateString] = {};
      swaps[dateString][exerciseId] = card.dataset.swapTo;
      saveSwaps(swaps);
      modal.classList.remove('active');
      renderCurrentPage();
    });
  });
}

// ============================================================
// RENDER: WEEK
// ============================================================
function renderWeek() {
  const monday = getMonday(today());
  const plan = loadWeekPlan(monday);

  // Plan bar
  const planBar = document.getElementById('plan-bar');
  if (plan) {
    // Count unique exercises across the week
    const allIds = new Set();
    plan.specialistIds.forEach(id => allIds.add(id));
    plan.days.forEach(dayIds => dayIds.forEach(id => allIds.add(id)));
    const totalExercises = loadExercises().length;
    planBar.innerHTML = `
      <div class="plan-info">
        <strong>Weekly Plan Active</strong><br>
        ${allIds.size}/${totalExercises} exercises covered &middot; 15 min/day
      </div>
      <button class="btn-plan" id="regen-plan-btn">Shuffle</button>`;
  } else {
    planBar.innerHTML = `
      <div class="plan-info">
        <strong>No plan yet</strong><br>
        Generate a smart 15-min daily plan
      </div>
      <button class="btn-plan" id="regen-plan-btn">Generate</button>`;
  }

  document.getElementById('regen-plan-btn').addEventListener('click', () => {
    generateWeeklyPlan(monday);
    renderWeek();
    if (currentPage === 'today') renderToday();
  });

  // Week grid
  const grid = document.getElementById('week-grid');
  let html = '';

  for (let i = 0; i < 7; i++) {
    const d = addDays(monday, i);
    const dt = new Date(d + 'T12:00:00');
    const isToday = d === today();
    const isFuture = d > today();
    const sel = d === selectedWeekDate;
    const daySchedule = getScheduleForDate(d);
    const { total, done } = getDayStats(d);
    const estTime = estimateDaySeconds(daySchedule);
    const timeLabel = total > 0 ? Math.round(estTime / 60) + 'm' : '';
    const dots = total > 0 ? (done === total ? '&#10003;' : Array(Math.min(done, 5)).fill('&#9679;').join('')) : '';

    html += `
      <div class="day-col ${isToday ? 'today' : ''} ${isFuture ? 'future' : ''} ${sel ? 'selected' : ''}" data-date="${d}">
        <div class="day-label">${DAY_NAMES[dt.getDay()]}</div>
        <div class="day-num">${dt.getDate()}</div>
        <div class="day-dots">${dots || '&nbsp;'}</div>
        <div class="day-time">${timeLabel}</div>
      </div>`;
  }
  grid.innerHTML = html;

  grid.querySelectorAll('.day-col').forEach(col => {
    col.addEventListener('click', () => {
      selectedWeekDate = col.dataset.date;
      renderWeek();
    });
  });

  // Day detail
  const detail = document.getElementById('week-day-detail');
  const scheduled = getScheduleForDate(selectedWeekDate);
  const { total, done } = getDayStats(selectedWeekDate);
  const estTime = estimateDaySeconds(scheduled);

  let detailHTML = `<div class="section-title">${formatDateShort(selectedWeekDate)} &mdash; ${done}/${total} done <span class="time-badge">~${formatTimeMinSec(estTime)}</span></div>`;

  if (scheduled.length === 0) {
    detailHTML += `<p style="color:var(--text-light);font-size:14px;padding:12px 0;">Rest day or no exercises assigned.</p>`;
  } else {
    // Show groups covered
    const groups = new Set(scheduled.map(ex => exGroup(ex)).filter(Boolean));
    if (groups.size > 0) {
      detailHTML += `<div class="coverage-note">Groups: ${[...groups].map(g => g.replace('Group ', '')).join(' &middot; ')}</div>`;
    }
    scheduled.forEach(ex => {
      detailHTML += exerciseCardHTML(ex, selectedWeekDate);
    });
  }
  detail.innerHTML = detailHTML;
  attachCardListeners(detail, selectedWeekDate);
}

// ============================================================
// RENDER: LIBRARY
// ============================================================
let libraryFilter = 'all';
let searchQuery = '';

function renderLibrary() {
  const exercises = loadExercises();
  const filterRow = document.getElementById('filter-row');
  const list = document.getElementById('library-list');

  // Build filter chips from categories + replacement groups
  const cats = [...new Set(exercises.map(e => exCategory(e)).filter(Boolean))];
  let chipHTML = `<div class="filter-chip ${libraryFilter === 'all' ? 'active' : ''}" data-filter="all">All</div>`;
  cats.forEach(a => {
    chipHTML += `<div class="filter-chip ${libraryFilter === a ? 'active' : ''}" data-filter="${a}">${a}</div>`;
  });
  filterRow.innerHTML = chipHTML;
  filterRow.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      libraryFilter = chip.dataset.filter;
      renderLibrary();
    });
  });

  document.getElementById('search-box').value = searchQuery;
  document.getElementById('search-box').oninput = (e) => {
    searchQuery = e.target.value.toLowerCase();
    renderLibrary();
  };

  let filtered = exercises;
  if (libraryFilter !== 'all') {
    filtered = filtered.filter(e => exCategory(e) === libraryFilter);
  }
  if (searchQuery) {
    filtered = filtered.filter(e =>
      e.name.toLowerCase().includes(searchQuery) ||
      exInstructions(e).toLowerCase().includes(searchQuery) ||
      exCategory(e).toLowerCase().includes(searchQuery) ||
      exGroup(e).toLowerCase().includes(searchQuery)
    );
  }

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">&#128218;</div>
        <p>${exercises.length === 0 ? 'No exercises yet.' : 'No matching exercises.'}</p>
      </div>`;
    return;
  }

  let html = '';
  filtered.forEach(ex => {
    const dose = exDoseText(ex);
    const varCount = exVariations(ex).length;
    const simCount = exSimilar(ex).length;
    const expanded = expandedCard === ex.id;
    const instructions = exInstructions(ex);
    const note = exNote(ex);
    const benefits = exBenefits(ex);
    const safety = exSafety(ex);
    const group = exGroup(ex);

    let detailHTML = '';
    if (instructions) detailHTML += `<div style="white-space:pre-line;line-height:1.6;">${instructions}</div>`;
    if (note) detailHTML += `<p style="margin-top:8px;font-style:italic;color:var(--primary-dark);">${note}</p>`;
    if (benefits) detailHTML += `<p style="margin-top:8px;font-size:12px;color:var(--text-light);">${benefits}</p>`;
    if (safety) detailHTML += `<p style="margin-top:6px;font-size:12px;color:var(--success);">${safety}</p>`;
    if (group) detailHTML += `<p style="margin-top:6px;font-size:11px;color:var(--text-light);">${group}</p>`;

    html += `
      <div class="exercise-card ${expanded ? 'expanded' : ''}" data-id="${ex.id}">
        <div class="card-top">
          <div class="card-info">
            <div class="card-name">${ex.name}</div>
            <div class="card-meta">
              <span>${dose}</span>
              <span class="tag">${exCategory(ex)}</span>
              <span class="tag">${exFreq(ex)}</span>
              ${varCount ? `<span class="tag">${varCount} var</span>` : ''}
              ${simCount ? `<span class="tag">${simCount} similar</span>` : ''}
            </div>
          </div>
        </div>
        <div class="card-detail">
          ${detailHTML || '<p>No instructions yet.</p>'}
        </div>
      </div>`;
  });
  list.innerHTML = html;

  list.querySelectorAll('.exercise-card').forEach(card => {
    card.addEventListener('click', () => {
      const id = card.dataset.id;
      expandedCard = expandedCard === id ? null : id;
      renderLibrary();
    });
  });
}

// ============================================================
// RENDER: STATS
// ============================================================
function renderStats() {
  const tracking = loadTracking();
  const exercises = loadExercises();
  const container = document.getElementById('stats-content');

  let totalDone = 0;
  let currentStreak = 0;
  let bestStreak = 0;
  let tempStreak = 0;

  for (let i = 29; i >= 0; i--) {
    const d = addDays(today(), -i);
    const { total, done } = getDayStats(d);
    if (total > 0 && done > 0) {
      tempStreak++;
      bestStreak = Math.max(bestStreak, tempStreak);
    } else if (total > 0) {
      tempStreak = 0;
    }
  }
  currentStreak = 0;
  for (let i = 0; i <= 30; i++) {
    const d = addDays(today(), -i);
    const { total, done } = getDayStats(d);
    if (total > 0 && done > 0) currentStreak++;
    else if (total > 0) break;
  }

  Object.values(tracking).forEach(day => {
    totalDone += Object.values(day).filter(Boolean).length;
  });

  const monday = getMonday(today());
  let weekTotal = 0, weekDone = 0;
  for (let i = 0; i < 7; i++) {
    const d = addDays(monday, i);
    if (d > today()) break;
    const s = getDayStats(d);
    weekTotal += s.total;
    weekDone += s.done;
  }

  // Category breakdown
  const catCounts = {};
  exercises.forEach(ex => {
    const c = exCategory(ex);
    catCounts[c] = (catCounts[c] || 0) + 1;
  });

  let html = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div class="stat-card">
        <div class="stat-num">${currentStreak}</div>
        <div class="stat-label">day streak</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${totalDone}</div>
        <div class="stat-label">total done</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${exercises.length}</div>
        <div class="stat-label">in library</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${weekTotal ? Math.round(weekDone / weekTotal * 100) : 0}%</div>
        <div class="stat-label">this week</div>
      </div>
    </div>

    <div class="section-title" style="margin-top:24px;">By category</div>`;

  Object.entries(catCounts).forEach(([cat, count]) => {
    html += `<div style="display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--border);font-size:14px;">
      <span>${cat}</span><span style="color:var(--text-light);">${count}</span></div>`;
  });

  html += `
    <div class="section-title" style="margin-top:24px;">Last 28 days</div>
    <div class="streak-calendar">`;

  for (let i = 27; i >= 0; i--) {
    const d = addDays(today(), -i);
    const { total, done } = getDayStats(d);
    let cls = '';
    if (total > 0 && done === total) cls = 'full';
    else if (done > 0) cls = 'has-activity';
    html += `<div class="streak-day ${cls}" title="${d}: ${done}/${total}"></div>`;
  }

  html += `</div>`;
  container.innerHTML = html;
}

document.getElementById('download-json-btn').addEventListener('click', () => {
  const exercises = loadExercises();
  const blob = new Blob([JSON.stringify(exercises, null, 2)], { type: 'application/json' });

});

  updateHeader();
  renderCurrentPage();
}

init();
